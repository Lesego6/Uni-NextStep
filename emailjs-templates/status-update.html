<div style="margin:0; padding:32px 16px; background:#eef3f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <div style="max-width:660px; margin:0 auto; background:#ffffff; border:1px solid #dfe7f0; border-radius:16px; overflow:hidden;">
    <div style="background:#1A3A6B; padding:28px 30px;">
      <p style="margin:0 0 10px; color:#6ee7d8; font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;">Uni NextStep</p>
      <h1 style="margin:0; color:#ffffff; font-size:26px;">{{status_title}}</h1>
      <p style="margin:10px 0 0; color:#dbeafe; font-size:15px;">Application update for {{course_name}}</p>
    </div>

    <div style="padding:30px;">
      <p style="margin:0 0 16px; font-size:16px; line-height:1.6;">Hi {{to_name}},</p>
      <p style="margin:0 0 24px; font-size:16px; line-height:1.7;">{{status_message}}</p>

      <div style="margin:0 0 22px; padding:18px; background:#f0fdfa; border:1px solid #99f6e4; border-left:5px solid #0d9488; border-radius:12px;">
        <p style="margin:0; color:#0f766e; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;">Status</p>
        <p style="margin:8px 0 0; color:#134e4a; font-size:22px; font-weight:700;">{{status_label}}</p>
      </div>

      <div style="background:#f8fafc; border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin:0 0 22px;">
        <p style="margin:0 0 8px;"><strong>Reference:</strong> {{reference_number}}</p>
        <p style="margin:0 0 8px;"><strong>Course:</strong> {{course_name}}</p>
        <p style="margin:0;"><strong>University:</strong> {{university_name}}</p>
      </div>

      <div style="margin:0 0 26px; padding:18px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px;">
        <p style="margin:0 0 6px; color:#1d4ed8; font-weight:700;">{{status_detail_title}}</p>
        <p style="margin:0; color:#1e3a8a; line-height:1.6;">{{status_detail}}</p>
      </div>

      <p style="margin:0; font-size:15px; line-height:1.7;">Regards,<br><strong>Uni NextStep</strong></p>
    </div>
  </div>
</div>
